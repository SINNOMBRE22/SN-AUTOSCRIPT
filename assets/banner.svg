<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="SN-AUTOSCRIPT — auto script VPS: SSH, Xray, Hysteria, ZivVPN, SlowDNS, UDP-Custom instalados en un solo paso">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04090B"/>
      <stop offset="1" stop-color="#071318"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2BFFA3"/>
      <stop offset="1" stop-color="#00B4FF"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.16" cy="0.25" r="0.55">
      <stop offset="0" stop-color="#2BFFA3" stop-opacity=".18"/>
      <stop offset="1" stop-color="#2BFFA3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#00B4FF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00B4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#12303A"/>
    </pattern>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)" opacity=".8"/>
  <rect width="1280" height="400" fill="url(#glowL)"/>
  <rect width="1280" height="400" fill="url(#glowR)"/>

  <!-- emblema: hexágono -->
  <g transform="translate(106 86)">
    <path d="M100 0 L196 56 V172 L100 228 L4 172 V56 Z" fill="url(#neon)" opacity=".3" filter="url(#blur)"/>
    <path d="M100 0 L196 56 V172 L100 228 L4 172 V56 Z" fill="#081418" stroke="url(#neon)" stroke-width="4"/>
    <path d="M100 26 L174 69 V159 L100 202 L26 159 V69 Z" fill="none" stroke="#1D4A52" stroke-width="1.5"/>
    <text x="100" y="128" text-anchor="middle" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="62" font-weight="800" fill="url(#neon)">SN</text>
    <text x="100" y="162" text-anchor="middle" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="17" fill="#7FC2C9" letter-spacing="5">AUTO</text>
  </g>

  <!-- título -->
  <g font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
    <text x="360" y="160" font-size="84" font-weight="800" fill="url(#neon)" opacity=".45" filter="url(#blur)">SN·AUTOSCRIPT</text>
    <text x="360" y="160" font-size="84" font-weight="800" fill="#F0FBF8">SN<tspan fill="url(#neon)">·AUTOSCRIPT</tspan></text>
    <text x="364" y="206" font-size="26" fill="#B4CFCB">Auto script VPS · un comando y todo queda instalado</text>
  </g>

  <!-- línea de terminal -->
  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="18">
    <text x="364" y="250" fill="#2BFFA3">root@vps<tspan fill="#3E6A70">:~#</tspan> <tspan fill="#D8EFEA">./install.sh</tspan>  <tspan fill="#3E6A70">→</tspan> <tspan fill="#00B4FF">13 servicios listos</tspan></text>
  </g>

  <!-- chips -->
  <g font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="17" font-weight="700">
    <g transform="translate(364 276)">
      <rect width="72" height="34" rx="17" fill="#0A1D1F" stroke="#2BFFA3" stroke-opacity=".6"/>
      <text x="36" y="23" text-anchor="middle" fill="#2BFFA3">SSH</text>
    </g>
    <g transform="translate(446 276)">
      <rect width="80" height="34" rx="17" fill="#0A1D1F" stroke="#2BFFA3" stroke-opacity=".6"/>
      <text x="40" y="23" text-anchor="middle" fill="#2BFFA3">XRAY</text>
    </g>
    <g transform="translate(536 276)">
      <rect width="124" height="34" rx="17" fill="#0A1D1F" stroke="#1FE3C0" stroke-opacity=".6"/>
      <text x="62" y="23" text-anchor="middle" fill="#1FE3C0">HYSTERIA</text>
    </g>
    <g transform="translate(670 276)">
      <rect width="100" height="34" rx="17" fill="#0A1D1F" stroke="#14D2D8" stroke-opacity=".6"/>
      <text x="50" y="23" text-anchor="middle" fill="#14D2D8">ZIVVPN</text>
    </g>
    <g transform="translate(780 276)">
      <rect width="112" height="34" rx="17" fill="#0A1D1F" stroke="#0AC2EC" stroke-opacity=".6"/>
      <text x="56" y="23" text-anchor="middle" fill="#0AC2EC">SLOWDNS</text>
    </g>
    <g transform="translate(902 276)">
      <rect width="136" height="34" rx="17" fill="#0A1D1F" stroke="#00B4FF" stroke-opacity=".6"/>
      <text x="68" y="23" text-anchor="middle" fill="#00B4FF">UDP-CUSTOM</text>
    </g>
    <g transform="translate(1048 276)">
      <rect width="148" height="34" rx="17" fill="#0A1D1F" stroke="#00B4FF" stroke-opacity=".6"/>
      <text x="74" y="23" text-anchor="middle" fill="#7FD6FF">+ panel web</text>
    </g>
  </g>

  <text x="364" y="352" font-family="'DejaVu Sans Mono', Consolas, monospace" font-size="16" fill="#5F8A8F">Ubuntu 18 → 24   ·   Debian 10 → 13   ·   Bots de Telegram y WhatsApp</text>
</svg>
